<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- 追蝴蝶/追光點: round-face kitten mid-pounce, front paw reaching out, expression 驚訝 -->

<!-- light dot -->
<circle cx="920" cy="360" r="14" fill="#C99A3E" opacity="0.7"></circle>
<circle cx="920" cy="360" r="26" fill="#C99A3E" opacity="0.25"></circle>

<!-- tail, flung back for balance -->
<path d="M 340 680 C 270 660, 220 610, 210 550 C 204 512, 224 480, 254 478" fill="none" stroke="#262229" stroke-width="40" stroke-linecap="round"></path>

<!-- back legs -->
<path d="M 470 780 L 500 900" fill="none" stroke="#262229" stroke-width="38" stroke-linecap="round"></path>
<path d="M 400 786 L 400 902" fill="none" stroke="#262229" stroke-width="36" stroke-linecap="round"></path>
<ellipse cx="502" cy="906" rx="17" ry="10" fill="#7A7480"></ellipse>
<ellipse cx="400" cy="908" rx="17" ry="10" fill="#7A7480"></ellipse>

<!-- body, stretched forward mid-leap -->
<ellipse cx="520" cy="710" rx="170" ry="100" fill="#262229"></ellipse>

<!-- reaching front paw -->
<path d="M 660 660 C 720 600, 770 540, 810 480" fill="none" stroke="#262229" stroke-width="42" stroke-linecap="round"></path>
<ellipse cx="822" cy="464" rx="19" ry="13" fill="#7A7480"></ellipse>
<path d="M 610 758 L 630 900" fill="none" stroke="#262229" stroke-width="38" stroke-linecap="round"></path>
<ellipse cx="632" cy="906" rx="17" ry="10" fill="#7A7480"></ellipse>

<!-- head, ROUND, thrust forward, alert -->
<ellipse cx="690" cy="560" rx="164" ry="158" fill="#262229"></ellipse>

<!-- ears -->
<path d="M 616 458 C 592 392, 568 340, 548 306 C 596 322, 648 360, 678 410 C 660 428, 638 444, 616 458 Z" fill="#262229"></path>
<path d="M 724 448 C 734 380, 740 324, 736 288 C 700 316, 670 356, 658 404 C 678 422, 700 436, 724 448 Z" fill="#262229"></path>
<path d="M 610 426 C 594 378, 578 340, 562 314 C 592 328, 620 358, 640 392 C 630 404, 620 415, 610 426 Z" fill="#3A3440"></path>
<path d="M 716 416 C 722 370, 726 332, 724 302 C 700 322, 682 350, 672 384 C 686 394, 700 406, 716 416 Z" fill="#3A3440"></path>

<!-- eye, wide with surprise -->
<path d="M 668 528 C 662 500, 688 480, 714 486 C 740 492, 754 518, 746 542 C 738 566, 708 578, 684 570 C 666 564, 670 546, 668 528 Z" fill="#C99A3E"></path>
<ellipse cx="708" cy="528" rx="11" ry="15" fill="#1A1720"></ellipse>

<!-- eyebrow -->
<path d="M 656 472 Q 688 448, 724 462" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"></path>

<!-- nose -->
<path d="M 818 560 L 836 572 L 814 584 Z" fill="#1A1720"></path>

<!-- mouth, surprised O -->
<circle cx="810" cy="596" r="9" fill="#1A1720"></circle>

<!-- whiskers -->
<path d="M 782 556 Q 850 546, 912 532" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"></path>
<path d="M 782 572 Q 848 580, 908 594" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"></path>
</svg>
