<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- 食嘢: round-face kitten with head lowered toward a bowl, expression 瞇眼笑 -->

<!-- bowl -->
<path d="M 380 860 C 380 890, 440 910, 512 910 C 584 910, 644 890, 644 860 L 636 850 L 388 850 Z" fill="#7A7480"></path>
<ellipse cx="512" cy="850" rx="132" ry="26" fill="#3A3440"></ellipse>

