<ellipse cx="560" cy="852" rx="40" ry="26" fill="#262229"></ellipse>
<ellipse cx="438" cy="852" rx="14" ry="8" fill="#7A7480"></ellipse>
<ellipse cx="562" cy="857" rx="14" ry="8" fill="#7A7480"></ellipse>

<!-- ears, floppy -->
