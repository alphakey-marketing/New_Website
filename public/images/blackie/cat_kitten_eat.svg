<path d="M 654 458 C 698 396, 730 344, 740 306 C 692 318, 640 354, 606 404 C 620 424, 636 442, 654 458 Z" fill="#262229"></path>
<path d="M 384 432 C 356 396, 336 366, 324 336 C 356 348, 386 372, 408 400 C 400 412, 392 422, 384 432 Z" fill="#3A3440"></path>
<path d="M 660 426 C 682 396, 700 368, 708 340 C 682 350, 656 372, 638 398 C 646 408, 654 418, 660 426 Z" fill="#3A3440"></path>

<!-- head, ROUND, lowered toward bowl -->
<ellipse cx="512" cy="580" rx="172" ry="164" fill="#262229"></ellipse>

<!-- eyes, content squint, spaced apart -->
<path d="M 414 618 Q 440 602, 468 616" stroke="#262229" stroke-width="10" stroke-linecap="round" fill="none"></path>
<path d="M 414 616 Q 440 604, 466 614" stroke="#C99A3E" stroke-width="4" stroke-linecap="round" fill="none"></path>
<path d="M 556 616 Q 582 600, 608 614" stroke="#262229" stroke-width="9" stroke-linecap="round" fill="none"></path>
<path d="M 556 614 Q 582 602, 606 612" stroke="#C99A3E" stroke-width="4" stroke-linecap="round" fill="none"></path>

<!-- nose -->
<path d="M 500 656 L 528 658 L 514 676 Z" fill="#1A1720"></path>

<!-- mouth, content -->
<path d="M 514 676 Q 518 686, 532 684" stroke="#1A1720" stroke-width="4.5" stroke-linecap="round" fill="none"></path>

<!-- whiskers -->
<path d="M 404 662 Q 312 660, 224 664" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"></path>
<path d="M 406 678 Q 316 684, 230 696" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"></path>
<path d="M 610 660 Q 702 656, 790 658" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"></path>
<path d="M 608 676 Q 698 680, 784 690" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"></path>
</svg>
