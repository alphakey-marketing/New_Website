<path d="M 700 800 C 770 780, 810 720, 794 660 C 784 624, 754 602, 726 612" fill="none" stroke="#262229" stroke-width="42" stroke-linecap="round"></path>

<!-- body, hunched forward, low round head -->
<path d="M 512 610 C 630 614, 712 678, 718 758 C 722 810, 674 848, 596 856 C 540 862, 480 860, 430 848 C 356 830, 312 792, 316 746 C 322 684, 400 616, 512 610 Z" fill="#262229"></path>

<!-- front paws near the bowl -->
