<path d="M 396 654 Q 342 664, 294 680" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
<path d="M 466 646 Q 510 640, 550 636" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"></path>
<path d="M 464 658 Q 506 668, 544 680" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
