<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- 跌一跤/滾地: round-face kitten flipped on its back, four legs up in the air, expression 驚訝 -->

<!-- tail, flailed to one side -->
<path d="M 720 700 C 790 670, 826 610, 806 550 C 794 514, 762 494, 734 504" fill="none" stroke="#262229" stroke-width="40" stroke-linecap="round"></path>

<!-- body, on its back -->
<ellipse cx="520" cy="700" rx="180" ry="140" fill="#262229"></ellipse>
<ellipse cx="520" cy="730" rx="110" ry="80" fill="#3A3440"></ellipse>

<!-- four legs up in the air -->
<path d="M 420 610 C 400 540, 380 480, 350 430" fill="none" stroke="#262229" stroke-width="36" stroke-linecap="round"></path>
<path d="M 500 590 C 496 520, 500 460, 486 404" fill="none" stroke="#262229" stroke-width="36" stroke-linecap="round"></path>
<path d="M 600 600 C 618 534, 646 478, 690 434" fill="none" stroke="#262229" stroke-width="36" stroke-linecap="round"></path>
<path d="M 660 630 C 696 574, 738 530, 788 500" fill="none" stroke="#262229" stroke-width="34" stroke-linecap="round"></path>
<ellipse cx="342" cy="416" rx="17" ry="12" fill="#7A7480"></ellipse>
<ellipse cx="482" cy="390" rx="16" ry="11" fill="#7A7480"></ellipse>
<ellipse cx="696" cy="422" rx="16" ry="11" fill="#7A7480"></ellipse>
<ellipse cx="796" cy="490" rx="16" ry="11" fill="#7A7480"></ellipse>

<!-- head, ROUND, tipped back on the ground, dazed -->
<ellipse cx="264" cy="700" rx="150" ry="142" fill="#262229"></ellipse>

<!-- ears, splayed from the tumble -->
<path d="M 336 594 C 378 542, 414 494, 428 456 C 384 464, 340 490, 306 530 C 316 552, 326 574, 336 594 Z" fill="#262229"></path>
<path d="M 192 600 C 154 558, 120 520, 90 496 C 102 534, 120 574, 148 606 C 163 604, 178 602, 192 600 Z" fill="#262229"></path>
<path d="M 332 556 C 362 518, 386 484, 398 454 C 368 462, 336 484, 312 512 C 318 527, 325 542, 332 556 Z" fill="#3A3440"></path>
<path d="M 196 572 C 168 542, 142 514, 118 496 C 128 524, 144 552, 164 576 C 175 575, 186 574, 196 572 Z" fill="#3A3440"></path>

<!-- eyes, wide with surprise -->
<path d="M 224 664 C 218 636, 244 616, 272 622 C 300 628, 316 654, 306 680 C 296 704, 266 718, 240 708 C 220 700, 224 682, 224 664 Z" fill="#C99A3E"></path>
<path d="M 320 660 C 324 632, 298 614, 272 620 C 244 626, 230 652, 240 678 C 250 702, 280 716, 306 706 C 326 698, 320 680, 320 660 Z" fill="#C99A3E"></path>
<ellipse cx="262" cy="664" rx="10" ry="14" fill="#1A1720"></ellipse>
<ellipse cx="300" cy="662" rx="10" ry="14" fill="#1A1720"></ellipse>

<!-- eyebrows, shocked -->
<path d="M 210 602 Q 246 580, 284 598" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"></path>

<!-- nose -->
<path d="M 204 722 L 180 726 L 196 744 Z" fill="#1A1720"></path>

<!-- mouth, surprised O -->
<circle cx="206" cy="758" r="10" fill="#1A1720"></circle>

<!-- whiskers, splayed from the fall -->
<path d="M 184 712 Q 114 694, 50 670" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"></path>
<path d="M 186 732 Q 116 726, 50 726" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"></path>
<path d="M 192 750 Q 132 760, 76 778" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
</svg>
