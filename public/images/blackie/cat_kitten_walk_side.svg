<path d="M 440 735 L 470 900" fill="none" stroke="#3A3440" stroke-width="34" stroke-linecap="round"></path>
<ellipse cx="649" cy="906" rx="17" ry="10" fill="#7A7480"></ellipse>
<ellipse cx="472" cy="906" rx="17" ry="10" fill="#7A7480"></ellipse>

