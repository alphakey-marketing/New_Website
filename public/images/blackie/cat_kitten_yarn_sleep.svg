<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- 玩線球玩到瞓低咗: round-face kitten flopped flat next to a yarn ball, worn out, eyes closed -->

<!-- yarn ball with loose thread -->
<circle cx="800" cy="770" r="70" fill="#D97F56"></circle>
<path d="M 740 730 Q 800 770, 750 810" stroke="#B85F3B" stroke-width="5" fill="none"></path>
<path d="M 830 720 Q 790 770, 850 800" stroke="#B85F3B" stroke-width="5" fill="none"></path>
<path d="M 680 790 Q 740 776, 730 730" stroke="#D97F56" stroke-width="6" fill="none" stroke-linecap="round"></path>

<!-- tail, flopped out flat -->
<path d="M 640 780 C 700 794, 748 786, 780 758" fill="none" stroke="#262229" stroke-width="38" stroke-linecap="round"></path>

<!-- back legs, splayed limp -->
<ellipse cx="540" cy="838" rx="46" ry="26" fill="#262229"></ellipse>
<ellipse cx="460" cy="850" rx="42" ry="24" fill="#262229"></ellipse>

<!-- body, flopped flat on its side -->
<ellipse cx="440" cy="740" rx="200" ry="110" fill="#262229"></ellipse>

<!-- front legs, limp and extended -->
<ellipse cx="250" cy="808" rx="46" ry="24" fill="#262229"></ellipse>
<ellipse cx="220" cy="812" rx="14" ry="8" fill="#7A7480"></ellipse>

<!-- head, ROUND, resting on the ground, eyes closed -->
<ellipse cx="264" cy="646" rx="140" ry="130" fill="#262229"></ellipse>

<!-- ears, one flopped down -->
<path d="M 328 552 C 346 490, 358 438, 354 404 C 322 428, 296 464, 286 508 C 300 524, 314 539, 328 552 Z" fill="#262229"></path>
<path d="M 234 558 C 214 532, 190 514, 162 508 C 166 538, 180 566, 204 584 C 214 576, 225 566, 234 558 Z" fill="#262229"></path>
<path d="M 322 518 C 330 480, 336 448, 334 422 C 314 442, 298 466, 290 494 C 300 502, 311 510, 322 518 Z" fill="#3A3440"></path>

<!-- closed eyes, tired -->
<path d="M 192 634 Q 208 644, 224 634" stroke="#14121A" stroke-width="4.5" stroke-linecap="round" fill="none"></path>

<!-- nose -->
<path d="M 150 668 L 128 674 L 146 688 Z" fill="#1A1720"></path>

<!-- small tired mouth -->
<path d="M 146 688 Q 140 696, 128 694" stroke="#1A1720" stroke-width="3.5" stroke-linecap="round" fill="none"></path>

<!-- whiskers, drooping tiredly -->
<path d="M 168 658 Q 98 662, 38 672" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"></path>
<path d="M 170 672 Q 100 684, 42 702" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
</svg>
